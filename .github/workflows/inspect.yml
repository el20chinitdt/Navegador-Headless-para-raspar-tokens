name: Headless F12 Inspector

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma de platforms.json (opcional)'
        required: false
        default: ''
      channel:
        description: 'Canal o ALL para rotar todos'
        required: false
        default: ''
      target_url:
        description: 'URL directa (opcional)'
        required: false
        default: ''
      wait_ms:
        description: 'Espera extra en ms'
        required: false
        default: '1500'
      use_login:
        description: 'Iniciar sesión'
        required: false
        type: boolean
        default: false
      platform_user:
        description: 'Usuario plataforma'
        required: false
        default: ''
      platform_pass:
        description: 'Contraseña plataforma'
        required: false
        default: ''
      embed_key:
        description: 'Contraseña general de cifrado'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: headless-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Enmascarar contraseñas en logs
        if: inputs.platform_pass != '' || inputs.embed_key != ''
        env:
          RAW_PASS: ${{ inputs.platform_pass }}
          RAW_EKEY: ${{ inputs.embed_key }}
        run: |
          if [ -n "$RAW_PASS" ]; then printf '::add-mask::%s\n' "$RAW_PASS"; fi
          if [ -n "$RAW_EKEY" ]; then printf '::add-mask::%s\n' "$RAW_EKEY"; fi

      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias rápido
        run: npm ci --prefer-offline 2>/dev/null || npm install --prefer-offline

      - name: Preparar Google Chrome en runner
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || true
            CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Bucle continuo Headless F12 + Imperio Player Full-Shield
        env:
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_URL: ${{ inputs.target_url }}
          INPUT_WAIT_MS: ${{ inputs.wait_ms }}
          USE_LOGIN: ${{ inputs.use_login || (inputs.platform_user != '' && inputs.platform_pass != '') }}
          PLATFORM_USER: ${{ inputs.platform_user || secrets.PLATFORM_USER }}
          PLATFORM_PASS: ${{ inputs.platform_pass || secrets.PLATFORM_PASS }}
          PLATFORM_LOGIN_URL: ${{ secrets.PLATFORM_LOGIN_URL }}
          USER_SELECTOR: ${{ secrets.USER_SELECTOR }}
          PASS_SELECTOR: ${{ secrets.PASS_SELECTOR }}
          SUBMIT_SELECTOR: ${{ secrets.SUBMIT_SELECTOR }}
          EMBED_KEY: ${{ inputs.embed_key || secrets.EMBED_SECRET }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { execFileSync, execSync } = require('child_process');

          const MAX_LOOP_MS = 300 * 60 * 1000;
          const startedAt = Date.now();
          const waitMs = String(Math.max(0, Number(process.env.INPUT_WAIT_MS ?? 1500)));
          const chromeBin = process.env.CHROME_BIN || '';
          const pass = process.env.PLATFORM_PASS || '';
          const embedPassword = process.env.EMBED_KEY || '';
          const sanitize = (str) => {
            let out = str;
            if (pass) out = out.split(pass).join('***');
            if (embedPassword) out = out.split(embedPassword).join('***');
            return out;
          };
          const refName = process.env.GITHUB_REF_NAME || 'main';

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            let files = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) files = files.concat(walk(full));
              else files.push(full);
            }
            return files;
          }

          function extractUrls(obj, found = new Set()) {
            if (typeof obj === 'string') {
              const matches = obj.match(/https?:\/\/[^\s"'<>]+/g);
              if (matches) matches.forEach(u => found.add(u));
            } else if (Array.isArray(obj)) obj.forEach(x => extractUrls(x, found));
            else if (obj && typeof obj === 'object') Object.values(obj).forEach(x => extractUrls(x, found));
            return Array.from(found);
          }

          function xorSha256(buf, xorSeed) {
            const out = Buffer.allocUnsafe(buf.length);
            const ctr = Buffer.allocUnsafe(36);
            xorSeed.copy(ctr, 0);
            let blockIdx = 0, mask = null;
            for (let i = 0; i < buf.length; i++) {
              const offset = i & 31;
              if (offset === 0) {
                ctr.writeUInt32BE(blockIdx++, 32);
                mask = crypto.createHash('sha256').update(ctr).digest();
              }
              out[i] = buf[i] ^ mask[offset];
            }
            return out;
          }

          function sealEnvelope(plainText, ikmBuf, infoStr) {
            const salt = crypto.randomBytes(16);
            const iv = crypto.randomBytes(12);
            const derived = Buffer.from(crypto.hkdfSync('sha512', ikmBuf, salt, Buffer.from(infoStr, 'utf8'), 96));
            const aesKey = derived.subarray(0, 32);
            const hmacKey = derived.subarray(32, 64);
            const xorSeed = derived.subarray(64, 96);

            const cipher = crypto.createCipheriv('aes-256-gcm', aesKey, iv);
            const aesOut = Buffer.concat([cipher.update(plainText, 'utf8'), cipher.final(), cipher.getAuthTag()]);
            const masked = xorSha256(aesOut, xorSeed);
            const authInput = Buffer.concat([salt, iv, masked]);
            const mac = crypto.createHmac('sha256', hmacKey).update(authInput).digest();
            return { s: salt.toString('base64'), v: iv.toString('base64'), d: masked.toString('base64'), m: mac.toString('base64') };
          }

          function buildTargets() {
            const rawCh = (process.env.INPUT_CHANNEL || '').trim();
            if (rawCh.toUpperCase() === 'ALL' && fs.existsSync('channels/list.json')) {
              try {
                const list = JSON.parse(fs.readFileSync('channels/list.json', 'utf8'));
                if (Array.isArray(list) && list.length) {
                  return list.map(item => ({ slug: item.slug, channel: item.slug, platform: item.platform || '', target_url: item.target_url || '' }));
                }
              } catch {}
            }
            const slug = (rawCh || 'live').toLowerCase().replace(/^ch_/, '').replace(/[^a-z0-9_-]+/g, '_') || 'live';
            return [{ slug, channel: rawCh, platform: process.env.INPUT_PLATFORM || '', target_url: process.env.INPUT_URL || '' }];
          }

          function buildImperioFullPayload(slug, chIkm) {
            const cssText = [
              ':host{display:block;width:100%;height:100%;margin:0;padding:0}',
              '#flow-player{max-width:1000px;margin:auto;position:relative;background:#000;border-radius:10px;overflow:hidden;font-family:Arial,sans-serif;height:100%;-webkit-user-select:none;user-select:none}',
              '#flow-player video,#flow-player canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}',
              '#flow-player canvas{z-index:1;pointer-events:none}',
              '#flow-player .controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);transition:opacity .25s;z-index:10}',
              '#flow-player input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:#fff}',
              '#flow-player input[type=range]::-webkit-slider-thumb{width:0;height:0}',
              '#flow-player input[type=range]::-moz-range-thumb{width:0;height:0;border:0}',
              '#flow-player button{background:none;border:0;cursor:pointer;width:34px}',
              '#fp_fs{position:absolute;top:10px;right:10px;z-index:15;transition:opacity .25s}',
              '#flow-player #fp_unmute_top{position:absolute;top:12px;left:12px;z-index:20;display:none;align-items:center;gap:8px;width:auto;padding:10px 16px 10px 12px;background:#14abd1;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;font:700 13px/1 Arial,sans-serif;letter-spacing:.2px;box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:fp_pulse 2s infinite;transition:transform .15s,background .2s,opacity .25s}',
              '#flow-player #fp_unmute_top:hover{background:#1bbce4;transform:scale(1.04)}',
              '#flow-player #fp_unmute_top:active{transform:scale(.96)}',
              '#flow-player #fp_unmute_top svg{flex:none}',
              '@keyframes fp_pulse{0%{box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 0 rgba(20,171,209,.6)}70%{box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 12px rgba(20,171,209,0)}100%{box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 0 rgba(20,171,209,0)}}',
              '@media (prefers-reduced-motion:reduce){#flow-player #fp_unmute_top{animation:none}}',
              '#fp_qmenu{position:absolute;bottom:60px;right:10px;background:#111;color:#fff;border-radius:6px;display:none;font-size:13px;z-index:25}',
              '#fp_qmenu div{padding:6px 10px;cursor:pointer}',
              '#fp_qmenu div:hover{background:#222}',
              '#flow-player:fullscreen,#flow-player:-webkit-full-screen{width:100%!important;height:100%!important;max-width:none!important;border-radius:0!important}',
              '#flow-player.hide-ui .controls,#flow-player.hide-ui #fp_fs{opacity:0;pointer-events:none}'
            ].join('');

            const domText = '<style>' + cssText + '</style>' +
              '<div id="flow-player">' +
                '<button id="fp_unmute_top"><svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>Activar sonido</button>' +
                '<video id="fp_video" playsinline autoplay preload="auto" disablePictureInPicture disableRemotePlayback controlsList="nodownload noplaybackrate noremoteplayback"></video>' +
                '<canvas id="glc"></canvas>' +
                '<button id="fp_fs"><svg viewBox="0 0 24 24" width="26" height="26" stroke="#14abd1" stroke-width="3" fill="none"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>' +
                '<div class="controls">' +
                  '<button id="fp_play"><svg id="fp_icoPlay" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg><svg id="fp_icoPause" viewBox="0 0 24 24" fill="#fff" style="display:none"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg></button>' +
                  '<input id="fp_bar" type="range" value="0" min="0" step="0.1">' +
                  '<button id="fp_mute"><svg viewBox="0 0 24 24" fill="#fff"><path d="M3 10v4h4l5 5V5L7 10z"/></svg></button>' +
                  '<button id="fp_gear"><svg viewBox="0 0 24 24" width="24" height="24" fill="#14abd1"><path d="M19.4 13.5c.04-.5.06-1 .06-1.5s-.02-1-.06-1.5l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.03 7.03 0 0 0-2.6-1.5l-.38-2.65A.5.5 0 0 0 13.1 1h-4a.5.5 0 0 0-.5.42l-.38 2.65a7.03 7.03 0 0 0-2.6 1.5l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64L2.6 10.5c-.04.5-.06 1-.06 1.5s.02 1 .06 1.5L.49 15.15a.5.5 0 0 0-.12.64l2 3.46c.14.24.43.34.69.22l2.49-1a7.03 7.03 0 0 0 2.6 1.5l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65a7.03 7.03 0 0 0 2.6-1.5l2.49 1c.26.12.55.02.69-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13.5zM11 15.5A3.5 3.5 0 1 1 11 8a3.5 3.5 0 0 1 0 7.5z"/></svg></button>' +
                '</div>' +
                '<div id="fp_qmenu"></div>' +
              '</div>';

            return `(async function () {
              const SLUG = ${JSON.stringify(slug)};
              const INFO = ${JSON.stringify('ch-stream-' + slug)};
              const base = location.pathname.split('/ch_')[0];
              let ikmBytes = Uint8Array.from(atob(${JSON.stringify(chIkm.toString('base64'))}), c => c.charCodeAt(0));
              const wipe = (a) => { try { if (a && a.fill) a.fill(0); } catch {} };

              if (navigator.webdriver || window._phantom || window.callPhantom || window.__nightmare || !navigator.languages || !navigator.languages.length) {
                wipe(ikmBytes); return;
              }
              try {
                if (!Function.prototype.toString.call(crypto.subtle.decrypt).includes('native code')) { wipe(ikmBytes); return; }
              } catch { wipe(ikmBytes); return; }

              // Montar todo dentro de Closed Shadow DOM en memoria RAM
              const host = document.createElement('div');
              host.style.cssText = 'width:100%;height:100%;margin:0;padding:0;display:block;';
              document.body.appendChild(host);
              const sr = host.attachShadow({ mode: 'closed' });
              sr.innerHTML = ${JSON.stringify(domText)};

              const $s = (id) => sr.getElementById(id);
              const video = $s('fp_video');
              const canvas = $s('glc');
              const bar = $s('fp_bar');
              const playBtn = $s('fp_play');
              const icoPlay = $s('fp_icoPlay');
              const icoPause = $s('fp_icoPause');
              const muteBtn = $s('fp_mute');
              const btnUnmuteTop = $s('fp_unmute_top');
              const fsBtn = $s('fp_fs');
              const gearBtn = $s('fp_gear');
              const qmenu = $s('fp_qmenu');
              const box = $s('flow-player');

              let hls = null, shakaPlayer = null, currentUrl = '', useWebGL = true, userPaused = false, userChoseMute = false, lockedOut = false, syncInt = null, guardInt = null;

              function clearPerf() {
                try {
                  if (performance.setResourceTimingBufferSize) performance.setResourceTimingBufferSize(0);
                  if (performance.clearResourceTimings) performance.clearResourceTimings();
                } catch {}
              }
              clearPerf();

              function lockOut() {
                if (lockedOut) return;
                lockedOut = true;
                clearInterval(syncInt); clearInterval(guardInt);
                wipe(ikmBytes); currentUrl = '';
                try { if (hls) { hls.destroy(); hls = null; } } catch {}
                try { if (shakaPlayer) { shakaPlayer.destroy(); shakaPlayer = null; } } catch {}
                try { video.pause(); video.removeAttribute('src'); video.load(); } catch {}
                try { sr.innerHTML = '<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#475569;font:600 13px Arial,sans-serif;">Protegido</div>'; } catch {}
                clearPerf();
              }

              // Bloqueo completo de consola, atajos, menú, selección, impresión y DevTools
              try {
                const noop = () => {};
                ['log','info','warn','error','debug','table','dir','trace','group','groupCollapsed','assert'].forEach(k => { try { console[k] = noop; } catch {} });
                try { Object.freeze(console); } catch {}
              } catch {}
              const killEv = (e) => { e.preventDefault(); e.stopPropagation(); return false; };
              ['contextmenu','selectstart','dragstart','copy','cut'].forEach(ev => {
                document.addEventListener(ev, killEv, true);
                sr.addEventListener(ev, killEv, true);
              });
              document.addEventListener('keydown', (e) => {
                const k = (e.key || '').toUpperCase();
                if (e.keyCode === 123 || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C','K'].includes(k)) || ((e.ctrlKey || e.metaKey) && ['U','S','P'].includes(k))) {
                  e.preventDefault(); e.stopPropagation(); return false;
                }
              }, true);

              const dbgFn = (function(){}).constructor('debugger');
              let dbgHits = 0;
              guardInt = setInterval(() => {
                if (lockedOut) return;
                clearPerf();
                if (document.hidden) return;
                const t0 = performance.now();
                dbgFn();
                if (performance.now() - t0 > 250) { if (++dbgHits >= 2) lockOut(); }
                else dbgHits = 0;
              }, 1500);

              function loadScript(src) {
                return new Promise((resolve) => {
                  const s = document.createElement('script');
                  s.src = src;
                  s.onload = () => { s.remove(); resolve(true); };
                  s.onerror = () => { s.remove(); resolve(false); };
                  document.head.appendChild(s);
                });
              }

              await Promise.allSettled([
                loadScript('https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js'),
                loadScript('https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js')
              ]);
              clearPerf();

              const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

              async function xorSha256(bytes, seed) {
                const out = new Uint8Array(bytes.length);
                const ctr = new Uint8Array(36);
                ctr.set(seed, 0);
                const dv = new DataView(ctr.buffer);
                let idx = 0, mask = null;
                for (let i = 0; i < bytes.length; i++) {
                  const off = i & 31;
                  if (off === 0) { dv.setUint32(32, idx++, false); mask = new Uint8Array(await crypto.subtle.digest('SHA-256', ctr)); }
                  out[i] = bytes[i] ^ mask[off];
                }
                wipe(ctr); wipe(mask);
                return out;
              }

              async function openEnvelope(env, ikm, infoStr) {
                const salt = b64(env.s), iv = b64(env.v), masked = b64(env.d), mac = b64(env.m);
                const hkdfKey = await crypto.subtle.importKey('raw', ikm, 'HKDF', false, ['deriveBits']);
                const bits = await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-512', salt: salt, info: new TextEncoder().encode(infoStr) }, hkdfKey, 768);
                const der = new Uint8Array(bits);
                const aesKey = await crypto.subtle.importKey('raw', der.slice(0, 32), 'AES-GCM', false, ['decrypt']);
                const hmacKey = await crypto.subtle.importKey('raw', der.slice(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
                const xorSeed = der.slice(64, 96);
                const authIn = new Uint8Array(salt.length + iv.length + masked.length);
                authIn.set(salt, 0); authIn.set(iv, salt.length); authIn.set(masked, salt.length + iv.length);
                const ok = await crypto.subtle.verify('HMAC', hmacKey, mac, authIn);
                if (!ok) { wipe(der); wipe(xorSeed); throw new Error('HMAC'); }
                const aesCipher = await xorSha256(masked, xorSeed);
                const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, aesKey, aesCipher);
                const obj = JSON.parse(new TextDecoder().decode(plainBuf));
                wipe(der); wipe(xorSeed); wipe(aesCipher); wipe(new Uint8Array(plainBuf));
                return obj;
              }

              const gl = canvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false });
              let prog = null, srcTex = null, fbos = [], texs = [], fboW = 0, fboH = 0, uTex, uPass, uSize;
              function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
              function initGL() {
                if (!gl) return false;
                const vs = 'attribute vec2 a_pos; varying vec2 v_uv; void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }';
                const fs = 'precision mediump float; varying vec2 v_uv; uniform sampler2D u_tex; uniform int u_pass; uniform vec2 u_size; void main(){ vec4 c = texture2D(u_tex, v_uv); if (u_pass == 0 || u_pass == 2 || u_pass == 4) { c.rgb = 1.0 - c.rgb; } else { c.rgb = 1.0 - c.rgb; } gl_FragColor = vec4(c.rgb, 1.0); }';
                prog = gl.createProgram();
                gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
                gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
                gl.linkProgram(prog); gl.useProgram(prog);
                const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
                const loc = gl.getAttribLocation(prog, 'a_pos'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
                uTex = gl.getUniformLocation(prog, 'u_tex'); uPass = gl.getUniformLocation(prog, 'u_pass'); uSize = gl.getUniformLocation(prog, 'u_size');
                srcTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, srcTex);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                return true;
              }
              function ensureFBOs(w, h) {
                if (w === fboW && h === fboH) return;
                fboW = w; fboH = h; canvas.width = w; canvas.height = h;
                fbos.forEach(f => gl.deleteFramebuffer(f)); texs.forEach(t => gl.deleteTexture(t)); fbos = []; texs = [];
                for (let i = 0; i < 2; i++) {
                  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
                  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
                  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
                  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
                  texs.push(t); fbos.push(f);
                }
                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
              }
              function fallbackToNative() { useWebGL = false; canvas.style.display = 'none'; }
              const glReady = initGL();
              if (!glReady) fallbackToNative();

              function renderLoop() {
                if (lockedOut) return;
                requestAnimationFrame(renderLoop);
