name: Headless F12 Inspector

on:
  workflow_dispatch:
    inputs:
      platform:
        required: false
        default: ''
      channel:
        required: false
        default: ''
      target_url:
        required: false
        default: ''
      wait_ms:
        required: false
        default: '1500'
      use_login:
        required: false
        type: boolean
        default: false
      platform_user:
        required: false
        default: ''
      platform_pass:
        required: false
        default: ''
      embed_key:
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: headless-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Enmascarar contraseñas
        if: inputs.platform_pass != '' || inputs.embed_key != ''
        env:
          RAW_PASS: ${{ inputs.platform_pass }}
          RAW_EKEY: ${{ inputs.embed_key }}
        run: |
          if [ -n "$RAW_PASS" ]; then printf '::add-mask::%s\n' "$RAW_PASS"; fi
          if [ -n "$RAW_EKEY" ]; then printf '::add-mask::%s\n' "$RAW_EKEY"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: |
          npm ci --prefer-offline 2>/dev/null || npm install --no-save --prefer-offline
          git checkout -- package-lock.json package.json 2>/dev/null || true

      - name: Preparar Google Chrome
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || true
            CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Headless continuo + Imperio Player cifrado
        env:
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_URL: ${{ inputs.target_url }}
          INPUT_WAIT_MS: ${{ inputs.wait_ms }}
          USE_LOGIN: ${{ inputs.use_login || (inputs.platform_user != '' && inputs.platform_pass != '') }}
          PLATFORM_USER: ${{ inputs.platform_user || secrets.PLATFORM_USER }}
          PLATFORM_PASS: ${{ inputs.platform_pass || secrets.PLATFORM_PASS }}
          PLATFORM_LOGIN_URL: ${{ secrets.PLATFORM_LOGIN_URL }}
          USER_SELECTOR: ${{ secrets.USER_SELECTOR }}
          PASS_SELECTOR: ${{ secrets.PASS_SELECTOR }}
          SUBMIT_SELECTOR: ${{ secrets.SUBMIT_SELECTOR }}
          EMBED_KEY: ${{ inputs.embed_key || secrets.EMBED_SECRET }}
          IMPERIO_UI: ${{ secrets.IMPERIO_UI }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { execFileSync, execSync } = require('child_process');

          const MAX_LOOP_MS = 300 * 60 * 1000;
          const startedAt = Date.now();
          const waitMs = String(Math.max(0, Number(process.env.INPUT_WAIT_MS ?? 1500)));
          const chromeBin = process.env.CHROME_BIN || '';
          const pass = process.env.PLATFORM_PASS || '';
          const embedPassword = process.env.EMBED_KEY || '';
          const rawUi = process.env.IMPERIO_UI || '';
          const refName = process.env.GITHUB_REF_NAME || 'main';
          const sanitize = (str) => {
            let out = str;
            if (pass) out = out.split(pass).join('***');
            if (embedPassword) out = out.split(embedPassword).join('***');
            return out;
          };

          function pushFiles(files, msg) {
            const existing = files.filter(p => fs.existsSync(p));
            if (!existing.length) return;
            execSync(`git add -f ${existing.map(p => `"${p}"`).join(' ')}`, { stdio: 'ignore' });
            execSync(`git diff --staged --quiet || (git commit -m "${msg} [skip ci]" && git pull --rebase origin "${refName}" && git push origin "${refName}")`, { stdio: 'inherit' });
          }

          if (!rawUi.trim()) {
            fs.writeFileSync('latest.json', JSON.stringify({
              run_id: process.env.GITHUB_RUN_ID,
              run_number: Number(process.env.GITHUB_RUN_NUMBER),
              ok: false,
              exit_code: 1,
              timestamp: new Date().toISOString(),
              input: { platform: process.env.INPUT_PLATFORM || '', channel: process.env.INPUT_CHANNEL || '', target_url: process.env.INPUT_URL || '' },
              reports: [],
              screenshot: null,
              log: 'Falta crear el Secret IMPERIO_UI en GitHub -> Settings -> Secrets and variables -> Actions.'
            }, null, 2));
            try { pushFiles(['latest.json'], 'Falta Secret IMPERIO_UI'); } catch {}
            process.exit(0);
          }

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            let files = [];
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, e.name);
              if (e.isDirectory()) files = files.concat(walk(full));
              else files.push(full);
            }
            return files;
          }

          function extractUrls(obj, found = new Set()) {
            if (typeof obj === 'string') {
              const m = obj.match(/https?:\/\/[^\s"'<>]+/g);
              if (m) m.forEach(u => found.add(u));
            } else if (Array.isArray(obj)) obj.forEach(x => extractUrls(x, found));
            else if (obj && typeof obj === 'object') Object.values(obj).forEach(x => extractUrls(x, found));
            return Array.from(found);
          }

          function xorSha256(buf, xorSeed) {
            const out = Buffer.allocUnsafe(buf.length);
            const ctr = Buffer.allocUnsafe(36);
            xorSeed.copy(ctr, 0);
            let idx = 0, mask = null;
            for (let i = 0; i < buf.length; i++) {
              const off = i & 31;
              if (off === 0) { ctr.writeUInt32BE(idx++, 32); mask = crypto.createHash('sha256').update(ctr).digest(); }
              out[i] = buf[i] ^ mask[off];
            }
            return out;
          }

          function sealEnvelope(plainText, ikmBuf, infoStr) {
            const salt = crypto.randomBytes(16), iv = crypto.randomBytes(12);
            const derived = Buffer.from(crypto.hkdfSync('sha512', ikmBuf, salt, Buffer.from(infoStr, 'utf8'), 96));
            const aesKey = derived.subarray(0, 32), hmacKey = derived.subarray(32, 64), xorSeed = derived.subarray(64, 96);
            const cipher = crypto.createCipheriv('aes-256-gcm', aesKey, iv);
            const aesOut = Buffer.concat([cipher.update(plainText, 'utf8'), cipher.final(), cipher.getAuthTag()]);
            const masked = xorSha256(aesOut, xorSeed);
            const authInput = Buffer.concat([salt, iv, masked]);
            const mac = crypto.createHmac('sha256', hmacKey).update(authInput).digest();
            return { s: salt.toString('base64'), v: iv.toString('base64'), d: masked.toString('base64'), m: mac.toString('base64') };
          }

          function readTargets() {
            const rawCh = (process.env.INPUT_CHANNEL || '').trim();
            if (rawCh.toUpperCase() === 'ALL' && fs.existsSync('channels/list.json')) {
              try {
                const list = JSON.parse(fs.readFileSync('channels/list.json', 'utf8'));
                if (Array.isArray(list) && list.length) {
                  return list.map(item => ({ slug: item.slug, channel: item.channel || item.slug, platform: item.platform || '', target_url: item.target_url || '' }));
                }
              } catch {}
            }
            const slug = (rawCh || 'live').toLowerCase().replace(/^ch_/, '').replace(/[^a-z0-9_-]+/g, '_') || 'live';
            return [{ slug, channel: rawCh, platform: process.env.INPUT_PLATFORM || '', target_url: process.env.INPUT_URL || '' }];
          }

          function buildProtectedPayload(slug, chIkm) {
            const rawStyle = (rawUi.match(/<style[^>]*>([\s\S]*?)<\/style>/i) || ['', ''])[1];
            const scopedCss = rawStyle.replace(/html\s*,\s*body/gi, ':host') +
              '\n:host{display:block;width:100%;height:100%;position:relative;-webkit-user-select:none;user-select:none}' +
              '\n#flow-player video,#flow-player canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}' +
              '\n#flow-player canvas{z-index:1;pointer-events:none}';

            const rawBody = (rawUi.match(/<body[^>]*>([\s\S]*?)(?:<script|<\/body>|$)/i) || ['', rawUi])[1].trim();
            const scopedHtml = rawBody
              .replace(/<video([^>]*)>/i, '<video$1 disablePictureInPicture disableRemotePlayback controlsList="nodownload noplaybackrate noremoteplayback">')
              .replace(/(<\/video>)/i, '$1<canvas id="glc"></canvas>');

            const domText = '<style>' + scopedCss + '</style>' + scopedHtml;

            return `(async function () {
              const SLUG = ${JSON.stringify(slug)};
              const INFO = ${JSON.stringify('ch-stream-' + slug)};
              const base = location.pathname.split('/ch_')[0];
              let ikmBytes = Uint8Array.from(atob(${JSON.stringify(chIkm.toString('base64'))}), c => c.charCodeAt(0));
              const wipe = (a) => { try { if (a && a.fill) a.fill(0); } catch {} };

              if (navigator.webdriver || window._phantom || window.callPhantom || window.__nightmare || !navigator.languages || !navigator.languages.length) { wipe(ikmBytes); return; }
              try { if (!Function.prototype.toString.call(crypto.subtle.decrypt).includes('native code')) { wipe(ikmBytes); return; } } catch { wipe(ikmBytes); return; }

              const host = document.createElement('div');
              host.style.cssText = 'width:100%;height:100%;margin:0;padding:0;display:block;';
              document.body.appendChild(host);
              const sr = host.attachShadow({ mode: 'closed' });
              sr.innerHTML = ${JSON.stringify(domText)};

              const $s = (id) => sr.getElementById(id);
              const video = $s('fp_video'), canvas = $s('glc'), bar = $s('fp_bar'), playBtn = $s('fp_play');
              const icoPlay = $s('fp_icoPlay'), icoPause = $s('fp_icoPause'), muteBtn = $s('fp_mute');
              const btnUnmuteTop = $s('fp_unmute_top'), fsBtn = $s('fp_fs'), gearBtn = $s('fp_gear'), qmenu = $s('fp_qmenu'), box = $s('flow-player');

              let hls = null, shakaPlayer = null, currentUrl = '', useWebGL = true, userPaused = false, userChoseMute = false, lockedOut = false, syncInt = null, guardInt = null;

              function clearPerf() { try { if (performance.setResourceTimingBufferSize) performance.setResourceTimingBufferSize(0); if (performance.clearResourceTimings) performance.clearResourceTimings(); } catch {} }
              clearPerf();

              function lockOut() {
                if (lockedOut) return; lockedOut = true;
                clearInterval(syncInt); clearInterval(guardInt); wipe(ikmBytes); currentUrl = '';
                try { if (hls) { hls.destroy(); hls = null; } } catch {}
                try { if (shakaPlayer) { shakaPlayer.destroy(); shakaPlayer = null; } } catch {}
                try { video.pause(); video.removeAttribute('src'); video.load(); } catch {}
                try { sr.innerHTML = '<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#475569;font:600 13px Arial,sans-serif;">Protegido</div>'; } catch {}
                clearPerf();
              }

              try { const noop = () => {}; ['log','info','warn','error','debug','table','dir','trace','group','groupCollapsed','assert'].forEach(k => { try { console[k] = noop; } catch {} }); try { Object.freeze(console); } catch {} } catch {}
              const killEv = (e) => { e.preventDefault(); e.stopPropagation(); return false; };
              ['contextmenu','selectstart','dragstart','copy','cut'].forEach(ev => { document.addEventListener(ev, killEv, true); sr.addEventListener(ev, killEv, true); });
              document.addEventListener('keydown', (e) => {
                const k = (e.key || '').toUpperCase();
                if (e.keyCode === 123 || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','J','C','K'].includes(k)) || ((e.ctrlKey || e.metaKey) && ['U','S','P'].includes(k))) {
                  e.preventDefault(); e.stopPropagation(); return false;
                }
              }, true);

              const dbgFn = (function(){}).constructor('debugger');
              let dbgHits = 0;
              guardInt = setInterval(() => {
                if (lockedOut) return; clearPerf(); if (document.hidden) return;
                const t0 = performance.now(); dbgFn();
                if (performance.now() - t0 > 250) { if (++dbgHits >= 2) lockOut(); } else dbgHits = 0;
              }, 1500);

              function loadScript(src) {
                return new Promise((resolve) => {
                  const s = document.createElement('script'); s.src = src;
                  s.onload = () => { s.remove(); resolve(true); };
                  s.onerror = () => { s.remove(); resolve(false); };
                  document.head.appendChild(s);
                });
              }
              await Promise.allSettled([
                loadScript('https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js'),
                loadScript('https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js')
              ]);
              clearPerf();

              const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
              async function xorSha256(bytes, seed) {
                const out = new Uint8Array(bytes.length), ctr = new Uint8Array(36); ctr.set(seed, 0);
                const dv = new DataView(ctr.buffer); let idx = 0, mask = null;
                for (let i = 0; i < bytes.length; i++) {
                  const off = i & 31;
                  if (off === 0) { dv.setUint32(32, idx++, false); mask = new Uint8Array(await crypto.subtle.digest('SHA-256', ctr)); }
                  out[i] = bytes[i] ^ mask[off];
                }
                wipe(ctr); wipe(mask); return out;
              }

              async function openEnvelope(env, ikm, infoStr) {
                const salt = b64(env.s), iv = b64(env.v), masked = b64(env.d), mac = b64(env.m);
                const hkdfKey = await crypto.subtle.importKey('raw', ikm, 'HKDF', false, ['deriveBits']);
                const bits = await crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-512', salt, info: new TextEncoder().encode(infoStr) }, hkdfKey, 768);
                const der = new Uint8Array(bits);
                const aesKey = await crypto.subtle.importKey('raw', der.slice(0, 32), 'AES-GCM', false, ['decrypt']);
                const hmacKey = await crypto.subtle.importKey('raw', der.slice(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
                const xorSeed = der.slice(64, 96);
                const authIn = new Uint8Array(salt.length + iv.length + masked.length);
                authIn.set(salt, 0); authIn.set(iv, salt.length); authIn.set(masked, salt.length + iv.length);
                const ok = await crypto.subtle.verify('HMAC', hmacKey, mac, authIn);
                if (!ok) { wipe(der); wipe(xorSeed); throw new Error('HMAC'); }
                const aesCipher = await xorSha256(masked, xorSeed);
                const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, aesCipher);
                const obj = JSON.parse(new TextDecoder().decode(plainBuf));
                wipe(der); wipe(xorSeed); wipe(aesCipher); wipe(new Uint8Array(plainBuf));
                return obj;
              }

              const gl = canvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false });
              let prog = null, srcTex = null, fbos = [], texs = [], fboW = 0, fboH = 0, uTex, uPass, uSize;
              function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
              function initGL() {
                if (!gl) return false;
                const vs = 'attribute vec2 a_pos; varying vec2 v_uv; void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }';
                const fs = 'precision mediump float; varying vec2 v_uv; uniform sampler2D u_tex; uniform int u_pass; uniform vec2 u_size; void main(){ vec4 c = texture2D(u_tex, v_uv); if (u_pass == 0 || u_pass == 2 || u_pass == 4) { c.rgb = 1.0 - c.rgb; } else { c.rgb = 1.0 - c.rgb; } gl_FragColor = vec4(c.rgb, 1.0); }';
                prog = gl.createProgram(); gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
                gl.linkProgram(prog); gl.useProgram(prog);
                const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
                const loc = gl.getAttribLocation(prog, 'a_pos'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
                uTex = gl.getUniformLocation(prog, 'u_tex'); uPass = gl.getUniformLocation(prog, 'u_pass'); uSize = gl.getUniformLocation(prog, 'u_size');
                srcTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, srcTex);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                return true;
              }
              function ensureFBOs(w, h) {
                if (w === fboW && h === fboH) return;
                fboW = w; fboH = h; canvas.width = w; canvas.height = h;
                fbos.forEach(f => gl.deleteFramebuffer(f)); texs.forEach(t => gl.deleteTexture(t)); fbos = []; texs = [];
                for (let i = 0; i < 2; i++) {
                  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
                  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
                  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
                  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
                  texs.push(t); fbos.push(f);
                }
                gl.bindFramebuffer(gl.FRAMEBUFFER, null);
              }
              function fallbackToNative() { useWebGL = false; canvas.style.display = 'none'; }
              const glReady = initGL(); if (!glReady) fallbackToNative();
              function renderLoop() {
                if (lockedOut) return; requestAnimationFrame(renderLoop);
                if (!useWebGL || !glReady || video.readyState < 2 || !video.videoWidth) return;
                try {
                  ensureFBOs(video.videoWidth, video.videoHeight);
                  gl.viewport(0, 0, fboW, fboH); gl.useProgram(prog); gl.uniform2f(uSize, fboW, fboH); gl.uniform1i(uTex, 0); gl.activeTexture(gl.TEXTURE0);
                  gl.bindTexture(gl.TEXTURE_2D, srcTex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
                  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
                  for (let pass = 0; pass < 6; pass++) {
                    gl.bindFramebuffer(gl.FRAMEBUFFER, pass === 5 ? null : fbos[pass % 2]);
                    gl.bindTexture(gl.TEXTURE_2D, pass === 0 ? srcTex : texs[(pass - 1) % 2]);
                    gl.uniform1i(uPass, pass); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                  }
                } catch { fallbackToNative(); }
              }
              requestAnimationFrame(renderLoop);

              function updateMuteButtonState() { btnUnmuteTop.style.display = video.muted ? 'flex' : 'none'; }
              video.addEventListener('volumechange', updateMuteButtonState);
              btnUnmuteTop.onclick = (e) => { e.stopPropagation(); userChoseMute = true; video.muted = false; safePlay(); updateMuteButtonState(); };
              function safePlay() {
                if (userPaused || lockedOut) return;
                const p = video.play();
                if (p !== undefined) p.catch((err) => { if (err.name === 'NotAllowedError' && !video.muted) { video.muted = true; updateMuteButtonState(); video.play().catch(() => {}); } });
              }
              ['click','touchend','pointerup','keydown'].forEach(ev => box.addEventListener(ev, (e) => {
                const t = e.target; if (t && t.closest && (t.closest('#fp_mute') || t.closest('#fp_unmute_top'))) return;
                if (!userChoseMute && video.muted) { video.muted = false; updateMuteButtonState(); }
                safePlay();
              }, { capture: true, passive: true }));

              const STD_H = [144,240,360,480,540,720,1080,1440,2160], URL_H = [144,240,360,480,540,576,720,1080,1440,2160,4320], EST_H = [144,240,360,480,720,1080,1440,2160];
              const near = (arr, h) => arr.reduce((a, b) => Math.abs(b - h) < Math.abs(a - h) ? b : a);
              const snapH = (h) => { const n = near(EST_H, h); return Math.abs(n - h) / n <= 0.08 ? n : h; };
              function urlH(l) { const m = String(l.uri || (Array.isArray(l.url) ? l.url[0] : l.url) || '').match(/(?:^|[^0-9a-z])(\\d{3,4})p(?:\\d{2})?(?![a-z0-9])/i); const n = m ? parseInt(m[1], 10) : 0; return URL_H.indexOf(n) >= 0 ? n : 0; }
              function lvlH(l) { if (l.height) return l.height; const r = l.attrs && l.attrs.RESOLUTION; if (r && /x/i.test(r)) { const p = String(r).split(/x/i).map(n => parseInt(n, 10)); if (p[1]) return p[1]; if (p[0]) return near(STD_H, Math.round(p[0] * 9 / 16)); } return urlH(l); }
              function brH(b) { return b < 500e3 ? 240 : b < 1000e3 ? 360 : b < 1800e3 ? 480 : b < 3500e3 ? 720 : b < 7000e3 ? 1080 : b < 14000e3 ? 1440 : 2160; }
              let calib = null, realByLevel = {}, lockedReal = 0, started = false;
              function calibrate() { if (calib || !hls || !hls.levels || !video.videoHeight) return; const idx = hls.currentLevel >= 0 ? hls.currentLevel : hls.loadLevel; const l = hls.levels[idx]; if (l && l.bitrate) { calib = { index: idx, bitrate: l.bitrate, height: snapH(video.videoHeight) }; realByLevel[idx] = calib.height; } }
              function estH(l, i) { return !l.bitrate ? 0 : calib ? (i === calib.index ? calib.height : near(EST_H, calib.height * Math.sqrt(l.bitrate / calib.bitrate))) : brH(l.bitrate); }
              function buildMenu(levels) {
                qmenu.innerHTML = ''; const auto = document.createElement('div'); auto.textContent = 'Auto'; auto.onclick = () => { if (hls) hls.currentLevel = -1; qmenu.style.display = 'none'; }; qmenu.appendChild(auto);
                if ((levels.length === 1 && !lvlH(levels[0]) && !(levels[0].audioCodec && !levels[0].videoCodec) && !lockedReal) || (!started && levels.some(l => !lvlH(l) && !(l.audioCodec && !l.videoCodec)))) levels = [];
                const seen = new Set(), ladder = [144,240,360,480,720,1080];
                levels.map((l, i) => {
                  const kh = realByLevel[i] || lvlH(l);
                  const lbl = kh ? kh + 'p' : (l.audioCodec && !l.videoCodec) ? 'Audio' : (levels.length === 1 && lockedReal) ? lockedReal + 'p' : (estH(l, i) || ladder[Math.max(0, Math.min(5, i + 6 - levels.length))]) + 'p';
                  return { label: lbl, height: kh || estH(l, i), bitrate: l.bitrate || 0, index: i };
                }).sort((a, b) => b.height - a.height || b.bitrate - a.bitrate).filter(l => !seen.has(l.label) && seen.add(l.label)).forEach(l => {
                  const d = document.createElement('div'); d.textContent = l.label; d.onclick = () => { if (hls) hls.currentLevel = l.index; qmenu.style.display = 'none'; }; qmenu.appendChild(d);
                });
              }
